<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coletor de Contexto</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px 14px;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      fieldset {
        border: 1px solid #d0d7de;
        border-radius: 6px;
        margin: 8px 0 0;
        padding: 4px 10px 8px;
      }
      legend {
        font-size: 11px;
        color: #57606a;
      }
      label {
        display: block;
        margin-top: 3px;
      }
      #status[data-kind='ok'] {
        color: #1a7f37;
      }
      #status[data-kind='error'] {
        color: #cf222e;
      }
      button {
        width: 100%;
        padding: 6px;
        margin-top: 8px;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .row button {
        margin-top: 6px;
      }
      button.secondary {
        font-size: 11px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>Coletor de Contexto</h1>
    <p id="status">Verificando a aba…</p>
    <div id="controls" hidden>
      <fieldset>
        <legend>Formatos</legend>
        <label><input type="checkbox" id="fmt-lunoda" /> Lunoda (.json + .md)</label>
        <label><input type="checkbox" id="fmt-simple" /> Markdown simples (.md)</label>
        <label
          ><input type="checkbox" id="fmt-cdc" /> JSON do CDC (.cdc.json, conversa inteira)</label
        >
      </fieldset>
      <fieldset>
        <legend>Incluir</legend>
        <label><input type="checkbox" id="opt-thinking" /> Pensamento (resumos)</label>
        <label><input type="checkbox" id="opt-files" /> Lista de arquivos</label>
      </fieldset>
      <button id="export" type="button">Exportar</button>
      <div class="row">
        <button id="copy-conversation" type="button">Copiar conversa</button>
        <button id="copy-last" type="button">Copiar última resposta</button>
      </div>
      <button id="raw" type="button" class="secondary">Salvar resposta bruta (depuração)</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
