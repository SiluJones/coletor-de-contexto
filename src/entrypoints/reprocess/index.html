<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reprocessar — Coletor de Contexto</title>
    <style>
      body {
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 18px;
      }
      fieldset {
        border: 1px solid #d0d7de;
        border-radius: 6px;
        margin: 10px 0 0;
        padding: 4px 12px 10px;
      }
      legend {
        font-size: 12px;
        color: #57606a;
      }
      label {
        display: block;
        margin-top: 4px;
      }
      #drop {
        margin-top: 12px;
        padding: 18px;
        border: 2px dashed #d0d7de;
        border-radius: 8px;
        text-align: center;
      }
      html.over {
        outline: 4px dashed #0969da;
        outline-offset: -8px;
        background: #f6f8fa;
      }
      html.over #drop {
        border-color: #0969da;
      }
      html {
        min-height: 100%;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #status[data-kind='ok'] {
        color: #1a7f37;
      }
      #status[data-kind='error'] {
        color: #cf222e;
      }
      #results li.error {
        color: #cf222e;
      }
    </style>
  </head>
  <body>
    <h1>Reprocessar arquivos guardados</h1>
    <p>
      Escolha respostas brutas (<code>cdc-raw/…json</code>) ou JSONs do CDC
      (<code>.cdc.json</code>). Os arquivos gerados caem em
      <code>Downloads/cdc-reprocessado/&lt;data-hora&gt;/</code>.
    </p>
    <fieldset>
      <legend>Formatos</legend>
      <label><input type="checkbox" id="fmt-simple" /> Markdown simples (.md, para ler)</label>
      <label><input type="checkbox" id="fmt-lunoda" /> Lunoda (.json + .md)</label>
      <label><input type="checkbox" id="fmt-cdc" /> JSON do CDC (.cdc.json)</label>
    </fieldset>
    <fieldset>
      <legend>Incluir</legend>
      <label><input type="checkbox" id="opt-thinking" /> Pensamento (resumos)</label>
      <label><input type="checkbox" id="opt-files" /> Lista de arquivos</label>
    </fieldset>
    <div id="drop">
      <input type="file" id="files" accept=".json,application/json" multiple />
      <p>ou arraste os arquivos para qualquer lugar desta página</p>
    </div>
    <button id="run" type="button" disabled>Reprocessar</button>
    <p id="status"></p>
    <ul id="results"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
